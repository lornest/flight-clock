name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Build and test (aarch64)
    # Native arm64: same architecture as the Pi, no cross-compiling
    runs-on: ubuntu-24.04-arm
    container: rust:1-bookworm
    steps:
      - uses: actions/checkout@v7
      - name: System libraries
        run: |
          apt-get update -qq
          apt-get install -y -qq pkg-config libudev-dev libinput-dev libxkbcommon-dev \
            libfontconfig-dev libseat-dev libgbm-dev
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked
      - run: cargo build --release --locked
      - name: Shell scripts parse
        run: |
          for f in scripts/*.sh migrations/*.sh; do
            if [ -e "$f" ]; then bash -n "$f"; fi
          done
