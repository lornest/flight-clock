name: Release

# Push a tag like v0.2.0 (or v0.3.0-beta.1 for the beta channel). This builds
# the release and creates a DRAFT on GitHub. Clocks ignore it until it's
# signed and published locally with scripts/publish-release.sh.

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    name: Build (aarch64)
    runs-on: ubuntu-24.04-arm
    # Bookworm keeps the binary's glibc requirement at 2.35 (Pi OS Bookworm+)
    container: rust:1-bookworm
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - name: Version from tag must match Cargo.toml
        id: version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          CARGO=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "$TAG" != "$CARGO" ]; then
            echo "Tag $GITHUB_REF_NAME doesn't match Cargo.toml version $CARGO"
            exit 1
          fi
          echo "version=$TAG" >> "$GITHUB_OUTPUT"
      - name: System libraries
        run: |
          apt-get update -qq
          apt-get install -y -qq pkg-config libudev-dev libinput-dev libxkbcommon-dev \
            libfontconfig-dev libseat-dev libgbm-dev
      - run: cargo test --locked
      - run: cargo build --release --locked
      - name: Package
        run: scripts/package-release.sh "${{ steps.version.outputs.version }}" target/release/flight-clock dist
      - uses: actions/upload-artifact@v7
        with:
          name: release
          path: dist/*
          if-no-files-found: error

  draft:
    name: Create draft release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: release
          path: dist
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          PRERELEASE=""
          case "$VERSION" in *-*) PRERELEASE="--prerelease" ;; esac
          # Release notes: this version's section of CHANGELOG.md
          awk -v v="$VERSION" '
            /^## / { if (p) exit; if (index($0, "[" v "]") || index($0, " " v)) { p=1; next } }
            p' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "FlightClock $VERSION" > notes.md
          gh release create "$GITHUB_REF_NAME" dist/* \
            --draft $PRERELEASE \
            --title "FlightClock $VERSION" \
            --notes-file notes.md
